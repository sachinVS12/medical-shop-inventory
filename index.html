<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Payment Form</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
      }

      body {
        background: #f4f7fb;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
      }

      .container {
        background: #fff;
        width: 400px;
        padding: 25px;
        border-radius: 12px;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
      }

      .container h2 {
        text-align: center;
        margin-bottom: 20px;
        color: #333;
      }

      .input-box {
        margin-bottom: 15px;
      }

      .input-box label {
        display: block;
        margin-bottom: 6px;
        font-weight: bold;
        color: #555;
      }

      .input-box input {
        width: 100%;
        padding: 12px;
        border: 1px solid #ccc;
        border-radius: 8px;
        font-size: 15px;
        outline: none;
        transition: 0.3s;
      }

      .input-box input:focus {
        border-color: #4a90e2;
      }

      .row {
        display: flex;
        gap: 10px;
      }

      .row .input-box {
        flex: 1;
      }

      .btn {
        width: 100%;
        padding: 14px;
        background: #4a90e2;
        border: none;
        color: white;
        font-size: 16px;
        border-radius: 8px;
        cursor: pointer;
        transition: 0.3s;
      }

      .btn:hover {
        background: #357abd;
      }

      .success {
        margin-top: 15px;
        text-align: center;
        color: green;
        font-weight: bold;
        display: none;
      }

      .error {
        color: red;
        font-size: 13px;
        margin-top: 5px;
        display: none;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <h2>Payment Form</h2>

      <form id="paymentForm">
        <div class="input-box">
          <label>Card Holder Name</label>
          <input type="text" id="name" placeholder="John Doe" required />
        </div>

        <div class="input-box">
          <label>Card Number</label>
          <input
            type="text"
            id="cardNumber"
            placeholder="1234 5678 9012 3456"
            maxlength="19"
            required
          />
          <div class="error" id="cardError">Invalid card number</div>
        </div>

        <div class="row">
          <div class="input-box">
            <label>Expiry Date</label>
            <input
              type="text"
              id="expiry"
              placeholder="MM/YY"
              maxlength="5"
              required
            />
          </div>

          <div class="input-box">
            <label>CVV</label>
            <input
              type="password"
              id="cvv"
              placeholder="123"
              maxlength="3"
              required
            />
          </div>
        </div>

        <div class="input-box">
          <label>Amount</label>
          <input type="number" id="amount" placeholder="100" required />
        </div>

        <button type="submit" class="btn">Pay Now</button>

        <div class="success" id="successMsg">Payment Successful!</div>
      </form>
    </div>

    <script>
      const form = document.getElementById("paymentForm");
      const cardInput = document.getElementById("cardNumber");
      const cardError = document.getElementById("cardError");
      const successMsg = document.getElementById("successMsg");

      // Auto format card number
      cardInput.addEventListener("input", function () {
        let value = this.value.replace(/\D/g, "");
        value = value.replace(/(.{4})/g, "$1 ").trim();
        this.value = value;
      });

      // Expiry auto format
      document.getElementById("expiry").addEventListener("input", function () {
        let value = this.value.replace(/\D/g, "");

        if (value.length >= 3) {
          value = value.substring(0, 2) + "/" + value.substring(2, 4);
        }

        this.value = value;
      });

      // Form submit
      form.addEventListener("submit", function (e) {
        e.preventDefault();

        const cardNumber = cardInput.value.replace(/\s/g, "");

        // Basic validation
        if (cardNumber.length !== 16) {
          cardError.style.display = "block";
          successMsg.style.display = "none";
          return;
        } else {
          cardError.style.display = "none";
        }

        successMsg.style.display = "block";

        // Reset form after success
        setTimeout(() => {
          form.reset();
          successMsg.style.display = "none";
        }, 3000);
      });
    </script>
  </body>
</html>
