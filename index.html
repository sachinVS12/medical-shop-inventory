<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ultra Attractive Payment Form</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Poppins", sans-serif;
      }

      body {
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #0b1020;
        overflow: hidden;
      }

      /* glowing animated background */
      .bg {
        position: absolute;
        width: 100%;
        height: 100%;
        background: linear-gradient(45deg, #7c3aed, #ec4899, #06b6d4, #4f46e5);
        background-size: 400% 400%;
        animation: moveBg 12s ease infinite;
        filter: blur(70px);
        opacity: 0.7;
      }

      @keyframes moveBg {
        0% {
          background-position: 0% 50%;
        }
        50% {
          background-position: 100% 50%;
        }
        100% {
          background-position: 0% 50%;
        }
      }

      /* floating shapes */
      .shape {
        position: absolute;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.1);
        animation: float 8s infinite ease-in-out;
      }

      .shape1 {
        width: 160px;
        height: 160px;
        top: 10%;
        left: 10%;
      }
      .shape2 {
        width: 220px;
        height: 220px;
        bottom: 5%;
        right: 8%;
        animation-duration: 10s;
      }
      .shape3 {
        width: 100px;
        height: 100px;
        top: 70%;
        left: 20%;
        animation-duration: 6s;
      }

      @keyframes float {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-25px);
        }
      }

      /* main card */
      .container {
        position: relative;
        z-index: 2;
        width: 420px;
        padding: 30px;
        border-radius: 30px;
        background: rgba(255, 255, 255, 0.08);
        backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.2);
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
        animation: fade 1s ease;
      }

      @keyframes fade {
        from {
          opacity: 0;
          transform: translateY(40px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .title {
        text-align: center;
        margin-bottom: 20px;
        color: white;
      }

      .title h1 {
        font-size: 30px;
        font-weight: 700;
      }

      .title p {
        font-size: 13px;
        opacity: 0.8;
      }

      /* CARD PREVIEW */
      .card {
        height: 200px;
        border-radius: 25px;
        padding: 20px;
        color: white;
        background: linear-gradient(135deg, #1e293b, #334155);
        margin-bottom: 20px;
        position: relative;
        overflow: hidden;
        transition: 0.5s;
      }

      .card:hover {
        transform: scale(1.03) rotateX(5deg);
      }

      .card::before {
        content: "";
        position: absolute;
        width: 200px;
        height: 200px;
        background: rgba(255, 255, 255, 0.08);
        border-radius: 50%;
        top: -80px;
        right: -60px;
      }

      .chip {
        width: 55px;
        height: 40px;
        background: gold;
        border-radius: 10px;
        margin-bottom: 25px;
      }

      .card-number {
        font-size: 20px;
        letter-spacing: 3px;
        margin-bottom: 20px;
      }

      .card-info {
        display: flex;
        justify-content: space-between;
        font-size: 13px;
      }

      /* INPUTS */
      .input-box {
        margin-bottom: 15px;
      }

      .input-box label {
        color: white;
        font-size: 13px;
        display: block;
        margin-bottom: 6px;
      }

      .input-box input {
        width: 100%;
        padding: 14px;
        border-radius: 15px;
        border: none;
        outline: none;
        background: rgba(255, 255, 255, 0.12);
        color: white;
        transition: 0.3s;
      }

      .input-box input:focus {
        background: rgba(255, 255, 255, 0.25);
        transform: scale(1.02);
        box-shadow: 0 0 20px rgba(124, 58, 237, 0.4);
      }

      .row {
        display: flex;
        gap: 10px;
      }

      .row .input-box {
        flex: 1;
      }

      /* BUTTON */
      .btn {
        width: 100%;
        padding: 16px;
        border: none;
        border-radius: 18px;
        background: linear-gradient(135deg, #7c3aed, #ec4899);
        color: white;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        position: relative;
        overflow: hidden;
        transition: 0.3s;
      }

      .btn::before {
        content: "";
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: rgba(255, 255, 255, 0.2);
        transition: 0.5s;
      }

      .btn:hover::before {
        left: 100%;
      }

      .btn:hover {
        transform: translateY(-3px);
        box-shadow: 0 10px 25px rgba(236, 72, 153, 0.4);
      }

      /* SUCCESS */
      .success {
        margin-top: 15px;
        text-align: center;
        color: #86efac;
        display: none;
        font-weight: 600;
      }
    </style>
  </head>

  <body>
    <div class="bg"></div>

    <div class="shape shape1"></div>
    <div class="shape shape2"></div>
    <div class="shape shape3"></div>

    <div class="container">
      <div class="title">
        <h1>💳 Payment</h1>
        <p>Fast • Secure • Modern</p>
      </div>

      <!-- CARD -->
      <div class="card">
        <div class="chip"></div>

        <div class="card-number" id="cardPreview">#### #### #### ####</div>

        <div class="card-info">
          <div>
            <small>NAME</small>
            <div id="namePreview">YOUR NAME</div>
          </div>

          <div>
            <small>EXP</small>
            <div id="expiryPreview">MM/YY</div>
          </div>
        </div>
      </div>

      <!-- FORM -->
      <form id="form">
        <div class="input-box">
          <label>Name</label>
          <input type="text" id="name" placeholder="John Doe" required />
        </div>

        <div class="input-box">
          <label>Card Number</label>
          <input
            type="text"
            id="cardNumber"
            placeholder="1234 5678 9012 3456"
            maxlength="19"
          />
        </div>

        <div class="row">
          <div class="input-box">
            <label>Expiry</label>
            <input type="text" id="expiry" placeholder="MM/YY" maxlength="5" />
          </div>

          <div class="input-box">
            <label>CVV</label>
            <input type="password" placeholder="123" maxlength="3" />
          </div>
        </div>

        <div class="input-box">
          <label>Amount</label>
          <input type="number" placeholder="₹1000" />
        </div>

        <button class="btn">Pay Now 🚀</button>

        <div class="success" id="success">Payment Successful ✅</div>
      </form>
    </div>

    <script>
      const card = document.getElementById("cardNumber");
      const name = document.getElementById("name");
      const expiry = document.getElementById("expiry");

      const cardPreview = document.getElementById("cardPreview");
      const namePreview = document.getElementById("namePreview");
      const expiryPreview = document.getElementById("expiryPreview");

      const success = document.getElementById("success");

      // card format
      card.addEventListener("input", () => {
        let v = card.value.replace(/\D/g, "");
        v = v.replace(/(.{4})/g, "$1 ").trim();
        card.value = v;
        cardPreview.innerText = v || "#### #### #### ####";
      });

      // name
      name.addEventListener("input", () => {
        namePreview.innerText = name.value.toUpperCase() || "YOUR NAME";
      });

      // expiry
      expiry.addEventListener("input", () => {
        let v = expiry.value.replace(/\D/g, "");
        if (v.length > 2) {
          v = v.substring(0, 2) + "/" + v.substring(2, 4);
        }
        expiry.value = v;
        expiryPreview.innerText = v || "MM/YY";
      });

      // submit
      document.getElementById("form").addEventListener("submit", (e) => {
        e.preventDefault();
        success.style.display = "block";

        setTimeout(() => {
          success.style.display = "none";
        }, 3000);
      });
    </script>
  </body>
</html>
