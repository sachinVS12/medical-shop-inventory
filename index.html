<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Modern Payment Form</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Poppins", sans-serif;
      }

      body {
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(135deg, #5b21b6, #7c3aed, #ec4899);
      }

      /* MAIN BOX */
      .container {
        width: 420px;
        background: white;
        border-radius: 30px;
        padding: 35px;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
        animation: show 1s ease;
      }

      @keyframes show {
        from {
          opacity: 0;
          transform: translateY(30px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .title {
        text-align: center;
        margin-bottom: 30px;
      }

      .title h1 {
        color: #5b21b6;
        font-size: 34px;
      }

      .title p {
        color: #666;
        margin-top: 5px;
      }

      /* PAYMENT BUTTONS */
      .payment-methods {
        display: flex;
        gap: 12px;
        margin-bottom: 25px;
      }

      .method {
        flex: 1;
        padding: 14px;
        border-radius: 16px;
        border: none;
        cursor: pointer;
        font-weight: 600;
        color: white;
        transition: 0.3s;
      }

      .card-btn {
        background: linear-gradient(135deg, #3b82f6, #06b6d4);
      }

      .upi-btn {
        background: linear-gradient(135deg, #ec4899, #f43f5e);
      }

      .wallet-btn {
        background: linear-gradient(135deg, #8b5cf6, #7c3aed);
      }

      .method:hover {
        transform: translateY(-4px);
      }

      /* INPUTS */
      .input-box {
        margin-bottom: 18px;
      }

      .input-box label {
        display: block;
        margin-bottom: 8px;
        color: #444;
        font-weight: 500;
      }

      .input-box input {
        width: 100%;
        padding: 15px;
        border-radius: 15px;
        border: 2px solid #eee;
        outline: none;
        font-size: 15px;
        transition: 0.3s;
      }

      .input-box input:focus {
        border-color: #8b5cf6;
        box-shadow: 0 0 15px rgba(139, 92, 246, 0.2);
      }

      /* ROW */
      .row {
        display: flex;
        gap: 15px;
      }

      .row .input-box {
        flex: 1;
      }

      /* PAY BUTTON */
      .pay-btn {
        width: 100%;
        padding: 17px;
        border: none;
        border-radius: 18px;
        background: linear-gradient(135deg, #8b5cf6, #ec4899);
        color: white;
        font-size: 18px;
        font-weight: 600;
        cursor: pointer;
        transition: 0.4s;
        margin-top: 10px;
      }

      .pay-btn:hover {
        transform: scale(1.03);
        box-shadow: 0 10px 25px rgba(236, 72, 153, 0.4);
      }

      /* CARD DESIGN */
      .card-preview {
        background: linear-gradient(135deg, #4f46e5, #7c3aed);
        border-radius: 25px;
        padding: 25px;
        color: white;
        margin-bottom: 25px;
        box-shadow: 0 15px 30px rgba(0, 0, 0, 0.2);
      }

      .card-top {
        display: flex;
        justify-content: space-between;
        margin-bottom: 40px;
      }

      .chip {
        width: 60px;
        height: 45px;
        background: gold;
        border-radius: 10px;
      }

      .visa {
        font-size: 28px;
        font-weight: 700;
      }

      .card-number {
        font-size: 22px;
        letter-spacing: 3px;
        margin-bottom: 25px;
      }

      .card-bottom {
        display: flex;
        justify-content: space-between;
      }

      /* SUCCESS */
      .success {
        margin-top: 20px;
        background: #dcfce7;
        color: #166534;
        padding: 14px;
        border-radius: 14px;
        text-align: center;
        display: none;
        animation: pop 0.5s ease;
      }

      @keyframes pop {
        from {
          transform: scale(0.7);
          opacity: 0;
        }
        to {
          transform: scale(1);
          opacity: 1;
        }
      }
    </style>
  </head>

  <body>
    <div class="container">
      <div class="title">
        <h1>💳 Payment</h1>
        <p>Fast & Secure Payment Form</p>
      </div>

      <!-- CARD -->
      <div class="card-preview">
        <div class="card-top">
          <div class="chip"></div>
          <div class="visa">VISA</div>
        </div>

        <div class="card-number" id="cardPreview">1234 5678 9012 3456</div>

        <div class="card-bottom">
          <div>
            <small>Card Holder</small>
            <h3 id="namePreview">YOUR NAME</h3>
          </div>

          <div>
            <small>Expires</small>
            <h3 id="expiryPreview">MM/YY</h3>
          </div>
        </div>
      </div>

      <!-- PAYMENT OPTIONS -->
      <div class="payment-methods">
        <button class="method card-btn">💳 Card</button>

        <button class="method upi-btn">📱 UPI</button>

        <button class="method wallet-btn">👛 Wallet</button>
      </div>

      <!-- FORM -->
      <form id="paymentForm">
        <div class="input-box">
          <label>Card Holder Name</label>

          <input type="text" id="name" placeholder="John Doe" required />
        </div>

        <div class="input-box">
          <label>Card Number</label>

          <input
            type="text"
            id="cardNumber"
            placeholder="1234 5678 9012 3456"
            maxlength="19"
            required
          />
        </div>

        <div class="row">
          <div class="input-box">
            <label>Expiry Date</label>

            <input
              type="text"
              id="expiry"
              placeholder="MM/YY"
              maxlength="5"
              required
            />
          </div>

          <div class="input-box">
            <label>CVV</label>

            <input type="password" placeholder="123" maxlength="3" required />
          </div>
        </div>

        <div class="input-box">
          <label>Amount</label>

          <input type="number" placeholder="₹1000" required />
        </div>

        <button class="pay-btn">Pay Now 🚀</button>

        <div class="success" id="success">✅ Payment Successful</div>
      </form>
    </div>

    <script>
      // INPUTS
      const cardInput = document.getElementById("cardNumber");
      const nameInput = document.getElementById("name");
      const expiryInput = document.getElementById("expiry");

      // PREVIEW
      const cardPreview = document.getElementById("cardPreview");
      const namePreview = document.getElementById("namePreview");
      const expiryPreview = document.getElementById("expiryPreview");

      // SUCCESS
      const success = document.getElementById("success");

      // CARD FORMAT
      cardInput.addEventListener("input", function () {
        let value = this.value.replace(/\D/g, "");

        value = value.replace(/(.{4})/g, "$1 ").trim();

        this.value = value;

        cardPreview.innerText = value || "1234 5678 9012 3456";
      });

      // NAME
      nameInput.addEventListener("input", function () {
        namePreview.innerText = this.value.toUpperCase() || "YOUR NAME";
      });

      // EXPIRY
      expiryInput.addEventListener("input", function () {
        let value = this.value.replace(/\D/g, "");

        if (value.length >= 3) {
          value = value.substring(0, 2) + "/" + value.substring(2, 4);
        }

        this.value = value;

        expiryPreview.innerText = value || "MM/YY";
      });

      // SUBMIT
      document
        .getElementById("paymentForm")
        .addEventListener("submit", function (e) {
          e.preventDefault();

          success.style.display = "block";

          setTimeout(() => {
            success.style.display = "none";
          }, 3000);
        });
    </script>
  </body>
</html>
