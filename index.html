<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Premium Payment Form</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Poppins", sans-serif;
      }

      body {
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
        background: linear-gradient(-45deg, #4f46e5, #7c3aed, #ec4899, #06b6d4);
        background-size: 400% 400%;
        animation: bgAnimation 12s ease infinite;
      }

      /* Animated Background */
      @keyframes bgAnimation {
        0% {
          background-position: 0% 50%;
        }
        50% {
          background-position: 100% 50%;
        }
        100% {
          background-position: 0% 50%;
        }
      }

      /* Floating circles */
      .circle {
        position: absolute;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.1);
        animation: float 10s infinite linear;
      }

      .circle:nth-child(1) {
        width: 120px;
        height: 120px;
        top: 10%;
        left: 10%;
      }

      .circle:nth-child(2) {
        width: 180px;
        height: 180px;
        bottom: 5%;
        right: 10%;
        animation-duration: 14s;
      }

      .circle:nth-child(3) {
        width: 80px;
        height: 80px;
        top: 70%;
        left: 20%;
        animation-duration: 8s;
      }

      @keyframes float {
        0% {
          transform: translateY(0px) rotate(0deg);
        }
        50% {
          transform: translateY(-30px) rotate(180deg);
        }
        100% {
          transform: translateY(0px) rotate(360deg);
        }
      }

      .container {
        width: 430px;
        padding: 30px;
        border-radius: 30px;
        background: rgba(255, 255, 255, 0.12);
        backdrop-filter: blur(18px);
        border: 1px solid rgba(255, 255, 255, 0.2);
        box-shadow: 0 15px 45px rgba(0, 0, 0, 0.35);
        position: relative;
        z-index: 2;
        animation: fadeIn 1s ease;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(30px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .title {
        text-align: center;
        color: white;
        margin-bottom: 25px;
      }

      .title h2 {
        font-size: 32px;
        font-weight: 700;
      }

      .title p {
        font-size: 14px;
        opacity: 0.8;
      }

      /* CARD */
      .card {
        height: 220px;
        border-radius: 24px;
        padding: 25px;
        position: relative;
        overflow: hidden;
        background: linear-gradient(135deg, #111827, #374151);
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.35);
        margin-bottom: 25px;
        transition: 0.5s;
      }

      .card:hover {
        transform: rotateY(8deg) rotateX(5deg);
      }

      .card::before {
        content: "";
        position: absolute;
        width: 250px;
        height: 250px;
        background: rgba(255, 255, 255, 0.08);
        border-radius: 50%;
        top: -100px;
        right: -80px;
      }

      .card::after {
        content: "";
        position: absolute;
        width: 180px;
        height: 180px;
        background: rgba(255, 255, 255, 0.05);
        border-radius: 50%;
        bottom: -80px;
        left: -60px;
      }

      .chip {
        width: 60px;
        height: 45px;
        background: linear-gradient(to bottom right, gold, #facc15);
        border-radius: 10px;
        margin-bottom: 30px;
      }

      .bank {
        position: absolute;
        top: 25px;
        right: 25px;
        color: white;
        font-size: 22px;
        font-weight: 600;
      }

      .card-number {
        color: white;
        font-size: 24px;
        letter-spacing: 4px;
        margin-bottom: 25px;
      }

      .card-details {
        display: flex;
        justify-content: space-between;
        color: white;
        font-size: 14px;
      }

      .input-box {
        margin-bottom: 18px;
      }

      .input-box label {
        color: white;
        display: block;
        margin-bottom: 8px;
        font-size: 14px;
      }

      .input-box input,
      .input-box select {
        width: 100%;
        padding: 14px;
        border: none;
        border-radius: 14px;
        background: rgba(255, 255, 255, 0.15);
        color: white;
        font-size: 15px;
        outline: none;
        transition: 0.3s;
      }

      .input-box input::placeholder {
        color: #ddd;
      }

      .input-box input:focus,
      .input-box select:focus {
        background: rgba(255, 255, 255, 0.25);
        transform: scale(1.02);
        box-shadow: 0 0 15px rgba(255, 255, 255, 0.2);
      }

      .row {
        display: flex;
        gap: 15px;
      }

      .row .input-box {
        flex: 1;
      }

      .pay-btn {
        width: 100%;
        padding: 16px;
        border: none;
        border-radius: 16px;
        background: linear-gradient(135deg, #06b6d4, #3b82f6);
        color: white;
        font-size: 18px;
        font-weight: 600;
        cursor: pointer;
        transition: 0.4s;
        overflow: hidden;
        position: relative;
      }

      .pay-btn::before {
        content: "";
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: rgba(255, 255, 255, 0.25);
        transition: 0.5s;
      }

      .pay-btn:hover::before {
        left: 100%;
      }

      .pay-btn:hover {
        transform: translateY(-3px);
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
      }

      .success {
        text-align: center;
        margin-top: 20px;
        color: #90ffb5;
        display: none;
        font-weight: 600;
        animation: pop 0.6s ease;
      }

      @keyframes pop {
        from {
          opacity: 0;
          transform: scale(0.5);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }

      .payment-icons {
        display: flex;
        justify-content: center;
        gap: 12px;
        margin-top: 20px;
      }

      .payment-icons img {
        width: 55px;
        transition: 0.3s;
      }

      .payment-icons img:hover {
        transform: scale(1.15);
      }

      @media (max-width: 500px) {
        .container {
          width: 92%;
          padding: 20px;
        }

        .card-number {
          font-size: 18px;
        }
      }
    </style>
  </head>

  <body>
    <div class="circle"></div>
    <div class="circle"></div>
    <div class="circle"></div>

    <div class="container">
      <div class="title">
        <h2>💳 Secure Payment</h2>
        <p>Fast • Safe • Encrypted</p>
      </div>

      <!-- CARD PREVIEW -->
      <div class="card">
        <div class="bank">VISA</div>

        <div class="chip"></div>

        <div class="card-number" id="cardPreview">#### #### #### ####</div>

        <div class="card-details">
          <div>
            <small>Card Holder</small>
            <div id="namePreview">YOUR NAME</div>
          </div>

          <div>
            <small>Expires</small>
            <div id="expiryPreview">MM/YY</div>
          </div>
        </div>
      </div>

      <!-- FORM -->
      <form id="paymentForm">
        <div class="input-box">
          <label>Card Holder Name</label>
          <input type="text" id="name" placeholder="John Doe" required />
        </div>

        <div class="input-box">
          <label>Card Number</label>
          <input
            type="text"
            id="cardNumber"
            placeholder="1234 5678 9012 3456"
            maxlength="19"
            required
          />
        </div>

        <div class="row">
          <div class="input-box">
            <label>Expiry Date</label>
            <input
              type="text"
              id="expiry"
              placeholder="MM/YY"
              maxlength="5"
              required
            />
          </div>

          <div class="input-box">
            <label>CVV</label>
            <input
              type="password"
              id="cvv"
              placeholder="123"
              maxlength="3"
              required
            />
          </div>
        </div>

        <div class="input-box">
          <label>Payment Method</label>

          <select required>
            <option value="">Select Method</option>
            <option>Credit Card</option>
            <option>Debit Card</option>
            <option>UPI</option>
            <option>Net Banking</option>
          </select>
        </div>

        <div class="input-box">
          <label>Amount</label>
          <input type="number" placeholder="₹1000" required />
        </div>

        <button type="submit" class="pay-btn">Pay Securely</button>

        <div class="success" id="success">✅ Payment Successful!</div>
      </form>

      <!-- PAYMENT ICONS -->
      <div class="payment-icons">
        <img src="https://cdn-icons-png.flaticon.com/512/196/196578.png" />
        <img src="https://cdn-icons-png.flaticon.com/512/5968/5968144.png" />
        <img src="https://cdn-icons-png.flaticon.com/512/825/825454.png" />
      </div>
    </div>

    <script>
      const cardInput = document.getElementById("cardNumber");
      const nameInput = document.getElementById("name");
      const expiryInput = document.getElementById("expiry");

      const cardPreview = document.getElementById("cardPreview");
      const namePreview = document.getElementById("namePreview");
      const expiryPreview = document.getElementById("expiryPreview");

      const form = document.getElementById("paymentForm");
      const success = document.getElementById("success");

      // Card Number Format
      cardInput.addEventListener("input", function () {
        let value = this.value.replace(/\D/g, "");

        value = value.replace(/(.{4})/g, "$1 ").trim();

        this.value = value;

        cardPreview.innerText = value || "#### #### #### ####";
      });

      // Name Preview
      nameInput.addEventListener("input", function () {
        namePreview.innerText = this.value.toUpperCase() || "YOUR NAME";
      });

      // Expiry Format
      expiryInput.addEventListener("input", function () {
        let value = this.value.replace(/\D/g, "");

        if (value.length >= 3) {
          value = value.substring(0, 2) + "/" + value.substring(2, 4);
        }

        this.value = value;

        expiryPreview.innerText = value || "MM/YY";
      });

      // Submit Animation
      form.addEventListener("submit", function (e) {
        e.preventDefault();

        success.style.display = "block";

        setTimeout(() => {
          success.style.display = "none";

          form.reset();

          cardPreview.innerText = "#### #### #### ####";

          namePreview.innerText = "YOUR NAME";

          expiryPreview.innerText = "MM/YY";
        }, 3000);
      });
    </script>
  </body>
</html>
