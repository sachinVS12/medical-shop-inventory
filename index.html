<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Modern Payment Form</title>

    <!-- Google Font -->
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Poppins", sans-serif;
      }

      body {
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(135deg, #4f46e5, #9333ea, #ec4899);
        overflow: hidden;
      }

      /* Background Glow */
      body::before,
      body::after {
        content: "";
        position: absolute;
        width: 300px;
        height: 300px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.1);
        filter: blur(30px);
        z-index: 0;
      }

      body::before {
        top: -100px;
        left: -100px;
      }

      body::after {
        bottom: -100px;
        right: -100px;
      }

      .container {
        position: relative;
        z-index: 1;
        width: 400px;
        padding: 30px;
        border-radius: 25px;
        background: rgba(255, 255, 255, 0.12);
        backdrop-filter: blur(18px);
        border: 1px solid rgba(255, 255, 255, 0.2);
        box-shadow: 0 15px 40px rgba(0, 0, 0, 0.25);
        color: #fff;
        animation: fadeIn 1s ease;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .container h2 {
        text-align: center;
        margin-bottom: 25px;
        font-size: 28px;
        font-weight: 600;
        letter-spacing: 1px;
      }

      .card-preview {
        background: linear-gradient(135deg, #1e293b, #334155);
        border-radius: 18px;
        padding: 20px;
        margin-bottom: 25px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        position: relative;
        overflow: hidden;
      }

      .card-preview::before {
        content: "";
        position: absolute;
        width: 150px;
        height: 150px;
        background: rgba(255, 255, 255, 0.08);
        border-radius: 50%;
        top: -60px;
        right: -50px;
      }

      .chip {
        width: 55px;
        height: 40px;
        background: gold;
        border-radius: 8px;
        margin-bottom: 20px;
      }

      .card-number {
        font-size: 22px;
        letter-spacing: 3px;
        margin-bottom: 20px;
      }

      .card-info {
        display: flex;
        justify-content: space-between;
        font-size: 14px;
        text-transform: uppercase;
      }

      .input-box {
        margin-bottom: 18px;
      }

      .input-box label {
        display: block;
        margin-bottom: 8px;
        font-size: 14px;
        color: #f1f1f1;
      }

      .input-box input {
        width: 100%;
        padding: 14px;
        border: none;
        outline: none;
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.15);
        color: #fff;
        font-size: 15px;
        transition: 0.3s;
      }

      .input-box input::placeholder {
        color: #ddd;
      }

      .input-box input:focus {
        background: rgba(255, 255, 255, 0.25);
        transform: scale(1.02);
      }

      .row {
        display: flex;
        gap: 15px;
      }

      .row .input-box {
        flex: 1;
      }

      .btn {
        width: 100%;
        padding: 15px;
        border: none;
        border-radius: 14px;
        background: linear-gradient(135deg, #06b6d4, #3b82f6);
        color: #fff;
        font-size: 17px;
        font-weight: 600;
        cursor: pointer;
        transition: 0.3s;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
      }

      .btn:hover {
        transform: translateY(-3px);
        box-shadow: 0 12px 25px rgba(0, 0, 0, 0.3);
      }

      .success {
        text-align: center;
        margin-top: 18px;
        color: #90ffb5;
        display: none;
        font-weight: 600;
        animation: pop 0.5s ease;
      }

      @keyframes pop {
        from {
          transform: scale(0.8);
          opacity: 0;
        }
        to {
          transform: scale(1);
          opacity: 1;
        }
      }

      @media (max-width: 450px) {
        .container {
          width: 90%;
          padding: 25px;
        }

        .card-number {
          font-size: 18px;
        }
      }
    </style>
  </head>

  <body>
    <div class="container">
      <h2>💳 Secure Payment</h2>

      <!-- Card Preview -->
      <div class="card-preview">
        <div class="chip"></div>

        <div class="card-number" id="previewNumber">#### #### #### ####</div>

        <div class="card-info">
          <span id="previewName">YOUR NAME</span>
          <span id="previewExpiry">MM/YY</span>
        </div>
      </div>

      <!-- Form -->
      <form id="paymentForm">
        <div class="input-box">
          <label>Card Holder Name</label>
          <input type="text" id="name" placeholder="John Doe" required />
        </div>

        <div class="input-box">
          <label>Card Number</label>
          <input
            type="text"
            id="cardNumber"
            placeholder="1234 5678 9012 3456"
            maxlength="19"
            required
          />
        </div>

        <div class="row">
          <div class="input-box">
            <label>Expiry Date</label>
            <input
              type="text"
              id="expiry"
              placeholder="MM/YY"
              maxlength="5"
              required
            />
          </div>

          <div class="input-box">
            <label>CVV</label>
            <input
              type="password"
              id="cvv"
              placeholder="123"
              maxlength="3"
              required
            />
          </div>
        </div>

        <div class="input-box">
          <label>Amount</label>
          <input type="number" placeholder="$100" required />
        </div>

        <button type="submit" class="btn">Pay Now</button>

        <div class="success" id="successMsg">✅ Payment Successful!</div>
      </form>
    </div>

    <script>
      const cardInput = document.getElementById("cardNumber");
      const nameInput = document.getElementById("name");
      const expiryInput = document.getElementById("expiry");

      const previewNumber = document.getElementById("previewNumber");
      const previewName = document.getElementById("previewName");
      const previewExpiry = document.getElementById("previewExpiry");

      const form = document.getElementById("paymentForm");
      const successMsg = document.getElementById("successMsg");

      // Card Number Formatting
      cardInput.addEventListener("input", function () {
        let value = this.value.replace(/\D/g, "");
        value = value.replace(/(.{4})/g, "$1 ").trim();
        this.value = value;

        previewNumber.innerText = value || "#### #### #### ####";
      });

      // Name Preview
      nameInput.addEventListener("input", function () {
        previewName.innerText = this.value.toUpperCase() || "YOUR NAME";
      });

      // Expiry Formatting
      expiryInput.addEventListener("input", function () {
        let value = this.value.replace(/\D/g, "");

        if (value.length >= 3) {
          value = value.substring(0, 2) + "/" + value.substring(2, 4);
        }

        this.value = value;

        previewExpiry.innerText = value || "MM/YY";
      });

      // Form Submit
      form.addEventListener("submit", function (e) {
        e.preventDefault();

        successMsg.style.display = "block";

        setTimeout(() => {
          successMsg.style.display = "none";
          form.reset();

          previewNumber.innerText = "#### #### #### ####";

          previewName.innerText = "YOUR NAME";

          previewExpiry.innerText = "MM/YY";
        }, 3000);
      });
    </script>
  </body>
</html>
